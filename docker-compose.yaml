# nginx proxy address - http://172.17.0.1:8085

name: kutt
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  kutt:
    image: kutt/kutt:latest
    pull_policy: always
    container_name: kutt-app
    restart: always
    logging: *default-logging
    networks:
      - kutt
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8085:3000"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: kutt-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SITE_NAME: ${APP_ORG_NAME:-Kutt}
      DEFAULT_DOMAIN: ${BASE_DOMAIN_NAME:-example.com}
      LINK_LENGTH: 6
      DISALLOW_REGISTRATION: false
      DISALLOW_ANONYMOUS_LINKS: false
      USER_LIMIT_PER_DAY: 50
      NON_USER_COOLDOWN: 0
      DEFAULT_MAX_STATS_PER_LINK: 5000
      CUSTOM_DOMAIN_USE_HTTPS: false
      DB_HOST: kutt-db
      DB_PORT: 5432
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-kutt}
      DB_USER: ${DB_USER_NAME:-kutt}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      REDIS_HOST: kutt-redis
      REDIS_PORT: 6379
      JWT_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      ADMIN_EMAILS: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      MAIL_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      MAIL_PORT: ${EMAIL_SERVER_PORT:-587}
      MAIL_SECURE: false
      MAIL_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      MAIL_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      REPORT_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
      CONTACT_EMAIL: ${APP_ADMIN_USER:-admin}@${BASE_DOMAIN_NAME:-example.com}
    volumes:
      - ./volumes/data/kutt:/data
    depends_on:
      kutt-db:
        condition: service_healthy
      kutt-redis:
        condition: service_started
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://kutt-app:3000'
      - 'cloudflare.hostname=kutt.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.kutt-app.entrypoints=http'
      - 'traefik.http.routers.kutt-app-secure.tls=true'
      - 'traefik.http.routers.kutt-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.kutt-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.kutt-app.middlewares=kutt-app-https-redirect'
      - 'traefik.http.routers.kutt-app-secure.entrypoints=https'
      - 'traefik.http.routers.kutt-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.kutt-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.kutt-app-secure.service=kutt-app'
      - 'traefik.http.services.kutt-app.loadbalancer.server.port=3000'

  kutt-db:
    image: postgres:latest
    pull_policy: always
    container_name: kutt-db
    restart: always
    logging: *default-logging
    networks:
      - kutt
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: kutt-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-kutt}
      POSTGRES_USER: ${DB_USER_NAME:-kutt}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/kutt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  kutt-redis:
    image: redis:alpine
    pull_policy: always
    container_name: kutt-redis
    restart: always
    logging: *default-logging
    networks:
      - kutt
    environment:
      CONTAINER_NAME: kutt-redis
    volumes:
      - ./volumes/data/db/redis/kutt:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  kutt:
    name: kutt
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
